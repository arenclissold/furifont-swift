name: Swift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        traits: ["", "--traits BundledFont"]
    steps:
      - uses: actions/checkout@v4
      - run: swift test --parallel ${{ matrix.traits }}
      - run: swift build -c release ${{ matrix.traits }}
      - run: python3 Scripts/check-consumer.py ${{ matrix.traits }}
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    strategy:
      matrix:
        traits: ["", "--traits BundledFont"]
    steps:
      - uses: actions/checkout@v4
      - name: Install consumer-check dependency
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - run: swift test --parallel ${{ matrix.traits }}
      - run: swift build -c release ${{ matrix.traits }}
      - run: python3 Scripts/check-consumer.py ${{ matrix.traits }}
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI product for iOS
        run: >-
          xcodebuild -scheme Furifont
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/ios build CODE_SIGNING_ALLOWED=NO
